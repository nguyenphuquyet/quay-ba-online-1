plugins {
    id "com.android.library" version "8.7.3"
}

android {
    namespace "com.quaybar.webview"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Thư viện Godot do app cung cấp lúc runtime, chỉ cần để biên dịch.
    compileOnly "org.godotengine:godot:4.7.2.stable"
}
